spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5433/medic_notifications
    username: ${DB_USER:medic}
    password: ${DB_PASSWORD:medic_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      pool-name: NotifHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:medic-redis-password}

# Africa's Talking — leave blank to use stub provider in local dev
africas-talking:
  api-key: ${AFRICAS_TALKING_API_KEY:}
  username: ${AFRICAS_TALKING_USERNAME:sandbox}
  sender-id: ${AFRICAS_TALKING_SENDER_ID:MEDIC}

server:
  port: 8088
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/hal+json
      - text/plain
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.medic: DEBUG
