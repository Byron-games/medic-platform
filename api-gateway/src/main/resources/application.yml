spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter: "#{@defaultRateLimiter}"
            key-resolver:       "#{@rateLimitKeyResolver}"
      routes:
        - id: auth-login
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/auth/login,/api/v1/auth/register
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@authRateLimiter}"
                key-resolver:       "#{@rateLimitKeyResolver}"
        - id: auth-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/auth/**
        - id: patient-identity-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/patients/**
        - id: emr-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/emr/**
        - id: appointment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/appointments/**
        - id: telemedicine-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/telemedicine/**
        - id: pharmacy-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/pharmacy/**
        - id: analytics-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/analytics/**
        - id: notification-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/notifications/**
        - id: ussd-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/ussd/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:medic-redis-password}

server:
  port: 8080
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/hal+json
      - text/plain
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never

jwt:
  secret: ${JWT_SECRET:local-dev-secret-must-be-at-least-32-chars-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.medic: DEBUG
    org.springframework.cloud.gateway: DEBUG