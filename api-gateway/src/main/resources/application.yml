spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8087
          predicates:
            - Path=/api/v1/auth/**
        - id: patient-identity-service
          uri: http://patient-identity-service:8081
          predicates:
            - Path=/api/v1/patients/**
        - id: emr-service
          uri: http://emr-service:8082
          predicates:
            - Path=/api/v1/emr/**
        - id: appointment-service
          uri: http://appointment-service:8083
          predicates:
            - Path=/api/v1/appointments/**
        - id: telemedicine-service
          uri: http://telemedicine-service:8084
          predicates:
            - Path=/api/v1/telemedicine/**
        - id: pharmacy-service
          uri: http://pharmacy-service:8085
          predicates:
            - Path=/api/v1/pharmacy/**
        - id: analytics-service
          uri: http://analytics-service:8086
          predicates:
            - Path=/api/v1/analytics/**
        - id: notification-service
          uri: http://notification-service:8088
          predicates:
            - Path=/api/v1/notifications/**
        - id: ussd-service
          uri: http://ussd-service:8089
          predicates:
            - Path=/api/v1/ussd/**

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-me-in-production-must-be-32-chars-min}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.medic: DEBUG
    org.springframework.cloud.gateway: INFO
