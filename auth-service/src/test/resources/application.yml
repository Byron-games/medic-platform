spring:
  application:
    name: auth-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6370

server:
  port: 0

jwt:
  secret: test-secret-that-is-definitely-at-least-32-chars-long
  access-token-expiry-ms: 60000
  refresh-token-expiry-ms: 3600000

logging:
  level:
    com.medic: DEBUG
