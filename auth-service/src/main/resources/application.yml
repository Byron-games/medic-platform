spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5433/medic_auth
    username: ${DB_USER:medic}
    # Default matches the .env DB_PASSWORD value for local dev
    password: ${DB_PASSWORD:medic_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: AuthHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Default matches the .env REDIS_PASSWORD value for local dev
      password: ${REDIS_PASSWORD:medic-redis-password}

server:
  port: 8087
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/hal+json
      - text/plain
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never

jwt:
  # Updated default fallback to a secure 512-bit hex key to prevent WeakKeyException
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    org.springframework.web: DEBUG
    com.medic: DEBUG
    org.springframework.security: INFO
