spring:
  application:
    name: telemedicine-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5433/medic_telemedicine
    username: ${DB_USER:medic}
    password: ${DB_PASSWORD:medic_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: TeleHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:medic-redis-password}

server:
  port: 8084
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/hal+json
      - text/plain
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never

jitsi:
  server-url: ${JITSI_SERVER_URL:https://meet.jit.si}

app:
  base-url: ${APP_BASE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.medic: DEBUG
