worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ──────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Gzip ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/hal+json image/svg+xml;

    # ── Rate limiting zones ──────────────────────────────────
    limit_req_zone $binary_remote_addr zone=global:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upstream services ────────────────────────────────────
    upstream gateway   { server api-gateway:8080; keepalive 32; }
    upstream frontend  { server frontend:80;      keepalive 16; }

    # ── Single HTTP server (temporary, no SSL) ─────────────
    # This avoids nginx failing when SSL certs are not yet available.
    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;
        limit_conn conn_limit 20;
        limit_req  zone=global burst=50 nodelay;

        # ── API Gateway ──────────────────────────────────────
        location /api/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Auth endpoints — tighter rate limit ──────────────
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://gateway;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── USSD webhook ─────────────────────────────────────
        location /ussd/ {
            proxy_pass         http://gateway/api/v1/ussd/;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_read_timeout 6s;
        }

        # ── React frontend ───────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
        }

        # ── Grafana (temporary proxy) ───────────────────────
        location /grafana/ {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Prometheus (temporary proxy) ────────────────────
        location /prometheus/ {
            proxy_pass http://prometheus:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Health check (internal) ──────────────────────────
        location /nginx-health {
            return 200 "healthy\n";
            access_log off;
        }
    }
}
