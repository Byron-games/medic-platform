worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ──────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Gzip ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/hal+json image/svg+xml;

    # ── Rate limiting zones ──────────────────────────────────
    limit_req_zone $binary_remote_addr zone=global:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upstream services ────────────────────────────────────
    upstream gateway   { server api-gateway:8080; keepalive 32; }
    upstream frontend  { server frontend:80;      keepalive 16; }

    # ── HTTP → HTTPS redirect ────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server ────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name medic.health www.medic.health;

        # SSL — replace with your actual certificate paths
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ── Security headers ─────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options            "DENY"            always;
        add_header X-Content-Type-Options     "nosniff"         always;
        add_header X-XSS-Protection           "1; mode=block"   always;
        add_header Referrer-Policy            "strict-origin"   always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

        # ── Connection limits ─────────────────────────────────
        limit_conn conn_limit 20;
        limit_req  zone=global burst=50 nodelay;

        client_max_body_size 10m;

        # ── API Gateway ──────────────────────────────────────
        location /api/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Auth endpoints — tighter rate limit ──────────────
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://gateway;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── USSD webhook ─────────────────────────────────────
        location /ussd/ {
            # Africa's Talking IPs only (uncomment and add actual IP ranges)
            # allow 196.201.214.0/24;
            # deny all;
            proxy_pass         http://gateway/api/v1/ussd/;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_read_timeout 6s;   # Africa's Talking requires response within 5 seconds
        }

        # ── React frontend ───────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;

            # Cache static assets (JS, CSS, images, fonts)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
                proxy_pass         http://frontend;
                expires            1y;
                add_header         Cache-Control "public, immutable";
            }
        }

        # ── Health check (internal) ──────────────────────────
        location /nginx-health {
            return 200 "healthy\n";
            access_log off;
        }
    }
}
