name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: medic
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: medic_auth
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules (skip tests first)
        run: mvn clean package -DskipTests -q

      - name: Run unit tests
        run: mvn test -q
        env:
          JWT_SECRET: test-secret-at-least-32-chars-for-ci-pipeline
          DB_HOST: localhost
          DB_USER: medic
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PASSWORD: ""

      - name: Frontend install & build
        working-directory: medic-frontend
        run: |
          npm ci
          npm run build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
