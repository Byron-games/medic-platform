name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, staging]
      services:
        description: Services to deploy (all = full deploy)
        required: false
        default: all
        type: string

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    concurrency:
      group: deploy-${{ github.event.inputs.environment }}
      cancel-in-progress: false   # Never cancel a running deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::error::VPS_HOST secret is not set"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          timeout:  300s
          script: |
            set -euo pipefail

            cd /opt/medic-platform

            echo ">>> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo ">>> Checking disk space..."
            df -h / | awk 'NR==2 {if ($5+0 > 90) {print "WARNING: Disk " $5 " full"; exit 1}}'

            # Selective or full deploy
            SERVICES="${{ github.event.inputs.services }}"
            if [ "$SERVICES" = "all" ] || [ -z "$SERVICES" ]; then
              echo ">>> Full platform deploy..."
              docker compose pull 2>/dev/null || true
              docker compose up -d --build --remove-orphans
            else
              echo ">>> Deploying: $SERVICES"
              docker compose up -d --build $SERVICES
            fi

            echo ">>> Waiting for health checks..."
            sleep 30

            echo ">>> Service status:"
            docker compose ps

            echo ">>> Checking gateway health..."
            curl -sf http://localhost:8080/actuator/health | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print('Gateway:', d['status'])"

            echo ">>> Pruning old images..."
            docker image prune -f --filter "until=24h" 2>/dev/null || true

            echo ">>> Deploy complete at $(date)"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment to ${{ github.event.inputs.environment }} failed"
          # Add Slack/email notification here in Phase 2

      - name: Create deployment summary
        if: success()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Services:** ${{ github.event.inputs.services }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
