spring:
  application:
    name: ussd-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5433/medic_ussd
    username: ${DB_USER:medic}
    password: ${DB_PASSWORD:medic_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      pool-name: UssdHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:medic-redis-password}

services:
  appointment-url: ${APPOINTMENT_SERVICE_URL:http://localhost:8083}
  pharmacy-url:    ${PHARMACY_SERVICE_URL:http://localhost:8085}
  patient-url:     ${PATIENT_SERVICE_URL:http://localhost:8081}
  analytics-url:   ${ANALYTICS_SERVICE_URL:http://localhost:8086}
server:
  port: 8089
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/hal+json
      - text/plain
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.medic: DEBUG
