# Production docker-compose — use with:
# docker compose -f docker-compose.prod.yml up -d
name: medic-prod

services:

  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: medic-postgres
    restart: always
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       medic_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d medic_auth"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks: [medic-net]
    # Do NOT expose port 5432 in production

  redis:
    image: redis:7-alpine
    container_name: medic-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks: [medic-net]

  # ── API Gateway ──────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: medic-gateway
    restart: always
    environment:
      JWT_SECRET:     ${JWT_SECRET}
      REDIS_HOST:     redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:    { condition: service_healthy }
    networks: [medic-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      start_period: 60s
      retries: 3

  # ── Auth Service ─────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: medic-auth
    restart: always
    environment:
      JWT_SECRET:     ${JWT_SECRET}
      DB_HOST:        postgres
      DB_USER:        ${DB_USER}
      DB_PASSWORD:    ${DB_PASSWORD}
      REDIS_HOST:     redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [medic-net]

  # ── Patient Identity ─────────────────────────────────────────
  patient-identity-service:
    build:
      context: .
      dockerfile: patient-identity-service/Dockerfile
    container_name: medic-patient
    restart: always
    environment:
      DB_HOST:        postgres
      DB_USER:        ${DB_USER}
      DB_PASSWORD:    ${DB_PASSWORD}
      REDIS_HOST:     redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [medic-net]

  # ── EMR Service ──────────────────────────────────────────────
  emr-service:
    build:
      context: .
      dockerfile: emr-service/Dockerfile
    container_name: medic-emr
    restart: always
    environment:
      DB_HOST:              postgres
      DB_USER:              ${DB_USER}
      DB_PASSWORD:          ${DB_PASSWORD}
      ANALYTICS_SERVICE_URL: http://analytics-service:8086
    depends_on:
      postgres: { condition: service_healthy }
    networks: [medic-net]

  # ── Appointment Service ──────────────────────────────────────
  appointment-service:
    build:
      context: .
      dockerfile: appointment-service/Dockerfile
    container_name: medic-appointment
    restart: always
    environment:
      DB_HOST:                  postgres
      DB_USER:                  ${DB_USER}
      DB_PASSWORD:              ${DB_PASSWORD}
      NOTIFICATION_SERVICE_URL: http://notification-service:8088
    depends_on:
      postgres: { condition: service_healthy }
    networks: [medic-net]

  # ── Telemedicine Service ─────────────────────────────────────
  telemedicine-service:
    build:
      context: .
      dockerfile: telemedicine-service/Dockerfile
    container_name: medic-telemedicine
    restart: always
    environment:
      DB_HOST:          postgres
      DB_USER:          ${DB_USER}
      DB_PASSWORD:      ${DB_PASSWORD}
      JITSI_SERVER_URL: ${JITSI_SERVER_URL:-https://meet.jit.si}
      APP_BASE_URL:     https://${DOMAIN}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [medic-net]

  # ── Pharmacy Service ─────────────────────────────────────────
  pharmacy-service:
    build:
      context: .
      dockerfile: pharmacy-service/Dockerfile
    container_name: medic-pharmacy
    restart: always
    environment:
      DB_HOST:     postgres
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [medic-net]

  # ── Analytics Service ────────────────────────────────────────
  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: medic-analytics
    restart: always
    environment:
      DB_HOST:     postgres
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST:  redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [medic-net]

  # ── Notification Service ─────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: medic-notification
    restart: always
    environment:
      DB_HOST:                     postgres
      DB_USER:                     ${DB_USER}
      DB_PASSWORD:                 ${DB_PASSWORD}
      AFRICAS_TALKING_API_KEY:     ${AFRICAS_TALKING_API_KEY:-}
      AFRICAS_TALKING_USERNAME:    ${AFRICAS_TALKING_USERNAME:-sandbox}
      AFRICAS_TALKING_SENDER_ID:   ${AFRICAS_TALKING_SENDER_ID:-MEDIC}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [medic-net]

  # ── USSD Service ─────────────────────────────────────────────
  ussd-service:
    build:
      context: .
      dockerfile: ussd-service/Dockerfile
    container_name: medic-ussd
    restart: always
    environment:
      DB_HOST:     postgres
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [medic-net]

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./medic-frontend
      dockerfile: Dockerfile
    container_name: medic-frontend
    restart: always
    networks: [medic-net]

  # ── Nginx Reverse Proxy ──────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: medic-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api-gateway
      - frontend
    networks:
      - medic-net
      - medic-external

  # ── Monitoring ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: medic-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-admin-api'
    networks: [medic-net]

  grafana:
    image: grafana/grafana:latest
    container_name: medic-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL:         https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [medic-net]

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  nginx_logs:

networks:
  medic-net:
    driver: bridge
    internal: true      # services cannot reach internet directly
  medic-external:
    driver: bridge      # only nginx touches the outside
    